name: Deploy para VPS OCR Analab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  VPS_HOST: 103.199.184.22
  VPS_USER: root
  APP_DIR: /var/www/ocr-api
  API_URL: https://ocr-api.wesleyv.online

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Empacotar código
        run: |
          tar czf /tmp/ocr-api.tgz --exclude='./.git' --exclude='./.venv' --exclude='__pycache__' --exclude='./.env' .
          ls -lh /tmp/ocr-api.tgz

      - name: Instalar sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Enviar para a VPS e fazer deploy
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          OPTS="-o StrictHostKeyChecking=no"
          sshpass -e scp $OPTS /tmp/ocr-api.tgz $VPS_USER@$VPS_HOST:/tmp/ocr-api.tgz
          sshpass -e ssh $OPTS $VPS_USER@$VPS_HOST "
            set -e
            mkdir -p $APP_DIR
            rm -rf $APP_DIR/app $APP_DIR/deploy
            tar xzf /tmp/ocr-api.tgz -C $APP_DIR
            rm /tmp/ocr-api.tgz
            bash $APP_DIR/deploy/remote.sh
          "

      - name: Verificar API publicada
        run: |
          sleep 5
          curl -sf "$API_URL/health" && echo " API no ar" \
            || echo "::warning::$API_URL/health não respondeu (DNS/certificado ainda não prontos?)"
